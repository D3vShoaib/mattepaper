<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; media-src 'self' blob: data:; frame-src blob:; object-src 'none'; base-uri 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A beautiful, local-first EPUB reader. Your books stay on your device."
    />
    <meta name="application-name" content="Mattepaper" />
    <meta name="theme-color" content="#16161a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Mattepaper" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#16161a" />

    <title>Mattepaper</title>

    <script src="/app-init.js"></script>

    <style>
      :root {
        color-scheme: light;
        --splash-bg: #f7f5f0;
        --splash-fg: #1c1b21;
        --splash-muted: #6e6a78;
      }

      html.dark {
        color-scheme: dark;
        --splash-bg: #16161a;
        --splash-fg: #f4f0e6;
        --splash-muted: #918d9c;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--splash-bg);
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        transition:
          opacity 320ms ease,
          visibility 320ms ease;
      }

      #app-splash[data-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        transform: translateY(-2vh);
      }

      .app-splash__icon {
        width: clamp(96px, 12vmin, 160px);
        height: auto;
        filter: drop-shadow(0 14px 30px rgb(0 0 0 / 26%));
      }

      .app-splash__title {
        margin: clamp(20px, 2.6vmin, 32px) 0 0;
        color: var(--splash-fg);
        font-family:
          "Space Grotesk Variable", "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(24px, 3vmin, 36px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .app-splash__tagline {
        margin: clamp(8px, 1vmin, 12px) 0 0;
        color: var(--splash-muted);
        font-family:
          "Space Grotesk Variable", "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(10px, 1.2vmin, 13px);
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
      }
    </style>

    <!-- Apple launch screens. Covers current iPhones and iPads in both orientations. -->
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__content">
        <img
          class="app-splash__icon"
          src="/icons/icon.svg"
          alt=""
          width="88"
          height="88"
        />
        <p class="app-splash__title">Mattepaper</p>
        <p class="app-splash__tagline">Your local library</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
