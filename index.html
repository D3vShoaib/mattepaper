    <title>Mattepaper</title>

    <script src="/app-init.js"></script>

    <style>
      :root {
        color-scheme: light;
        --splash-bg: #f7f5f0;
        --splash-fg: #1c1b21;
        --splash-muted: #6e6a78;
      }

      html.dark {
        color-scheme: dark;
        --splash-bg: #16161a;
        --splash-fg: #f4f0e6;
        --splash-muted: #918d9c;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--splash-bg);
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        transition:
          opacity 320ms ease,
          visibility 320ms ease;
      }

      #app-splash[data-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        transform: translateY(-2vh);
      }

      .app-splash__icon {
        width: clamp(96px, 12vmin, 160px);
        height: auto;
        filter: drop-shadow(0 14px 30px rgb(0 0 0 / 26%));
      }

      .app-splash__title {
        margin: clamp(20px, 2.6vmin, 32px) 0 0;
        color: var(--splash-fg);
        font-family:
          "Space Grotesk Variable", "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(24px, 3vmin, 36px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .app-splash__tagline {
        margin: clamp(8px, 1vmin, 12px) 0 0;
        color: var(--splash-muted);
        font-family:
          "Space Grotesk Variable", "Space Grotesk", "Segoe UI", sans-serif;
        font-size: clamp(10px, 1.2vmin, 13px);
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
      }
    </style>
